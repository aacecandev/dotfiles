---
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
        exclude: lazyvim\.json$
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks-docker

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # ShellCheck has no zsh support, so skip zsh config files that use
        # zsh-only syntax (.zshrc and the *.zsh files in .config/zsh/) and the
        # bundled zsh completion functions under .config/zsh/completions/.
        exclude: '(^|/)\.zshrc$|^\.config/zsh/[^/]+\.zsh$|^\.config/zsh/completions/|^tests/'
        args:
          - --norc
          - --check-sourced
          - --severity=error
          - --external-sources
      # The test scripts get the stricter warning level: an unquoted variable
      # or a lost exit code there hides a failing check.
      - id: shellcheck
        name: ShellCheck (tests, warning level)
        files: ^tests/
        args:
          - --norc
          - --check-sourced
          - --severity=warning
          - --external-sources

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        types: [file, yaml]
        entry: yamllint
        args:
          [
            "--no-warnings",
            "-d",
            "{extends: relaxed, rules: {line-length: {max: 500}}}",
          ]

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args:
          - --alive=200,301,302,402,403,407
          - --quiet

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint-cli2.jsonc"]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.263.5
    hooks:
      - id: renovate-config-validator

  # End-to-end bootstrap test (tests/run.sh): builds the Docker image, runs
  # install.sh twice, then tests/checks.sh. Runs on every commit, so a commit
  # needs a passing image build and checks; takes several minutes. mise exec
  # decrypts GITHUB_TOKEN from mise.local.toml (docs/github-token.md).
  - repo: local
    hooks:
      - id: bootstrap-test
        name: bootstrap test (docker)
        entry: mise exec -- sh tests/run.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
