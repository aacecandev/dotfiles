# Renovate: open PRs that bump the pinned versions in .config/mise/config.toml,
# .pre-commit-config.yaml, .config/sheldon/plugins.toml and the actions in
# .github/workflows/ (config in .github/renovate.json).
#
# Authenticates as a private GitHub App (GITHUB_TOKEN cannot push workflow
# file changes): repository variable RENOVATE_APP_CLIENT_ID and
# secret RENOVATE_APP_PRIVATE_KEY. App setup and permissions: docs/renovate.md.
name: renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # Re-run when a checkbox is ticked on the Dependency Dashboard issue.
  # https://docs.renovatebot.com/key-concepts/dashboard/
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # On issue edits, run only for the dashboard and only when a box is
    # ticked. Renovate's own dashboard rewrites leave every box unticked, so
    # this also stops it from re-triggering itself.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' &&
      contains(github.event.issue.body, '- [x] '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Short-lived (1 h) installation token, scoped to this repository and
      # to the permissions Renovate needs.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      # Commits are authored as the App's bot user, so the API-created
      # (platformCommit) commits match their author and show as Verified.
      - id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "git-author=${APP_SLUG}[bot] <${id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.git-author }}
