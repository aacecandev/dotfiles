# Renovate: open PRs that bump the pinned tool versions in
# .config/mise/config.toml (config in .github/renovate.json).
# https://docs.renovatebot.com/modules/manager/mise/
#
# RENOVATE_TOKEN is a fine-grained PAT (not GITHUB_TOKEN, so Renovate's PRs
# trigger the ci workflow). Required permissions: docs/renovate.md.
name: renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # Re-run when a checkbox is ticked on the Dependency Dashboard issue.
  # https://docs.renovatebot.com/key-concepts/dashboard/
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # On issue edits, run only for the dashboard and only when a box is
    # ticked. Renovate's own dashboard rewrites leave every box unticked, so
    # this also stops it from re-triggering itself.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' &&
      contains(github.event.issue.body, '- [x] '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # renovatebot/github-action v46.3.14
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_PLATFORM_COMMIT: "enabled"
          # Author commits as the token owner (public noreply address) instead
          # of Renovate's default Mend-owned account, which GitHub flags as
          # Unverified. https://github.com/renovatebot/renovate/discussions/39309
          RENOVATE_GIT_AUTHOR: "aacecandev <21305300+aacecandev@users.noreply.github.com>"
