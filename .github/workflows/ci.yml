# CI: run the same gates as the local workflow (AGENTS.md "Commands"), then,
# on main only, tag the commit with the next semantic version derived from
# Conventional Commits since the previous tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Static gates: lint, format, secret scan.
      # https://pre-commit.com
      - name: pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

      # End-to-end bootstrap test in a disposable container.
      - name: Bootstrap test
        run: sh tests/run.sh

      # actions/upload-artifact v7.0.2
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore
          # Minimum allowed retention; logs are only for debugging a failed run.
          retention-days: 1

  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag
      cancel-in-progress: false
    steps:
      # actions/checkout v7.0.1; full history and tags to find the last version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Bump rules (https://www.conventionalcommits.org):
      #   "type!:" or "BREAKING CHANGE:" -> major
      #   feat                           -> minor
      #   fix, perf                      -> patch
      #   anything else                  -> no new tag
      - name: Create semver tag
        run: |
          set -eu
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; last="v0.0.0"; fi
          log="$(git log --format='%s%n%b' "$range")"

          if printf '%s\n' "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
            bump=major
          elif printf '%s\n' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$log" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          else
            echo "No releasable commits since $last; skipping tag."
            exit 0
          fi

          IFS=. read -r major minor patch <<EOF
          ${last#v}
          EOF
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v$major.$minor.$patch"

          echo "$last -> $next ($bump)"
          git tag "$next" "$GITHUB_SHA"
          git push origin "refs/tags/$next"
          echo "Tagged $next" >> "$GITHUB_STEP_SUMMARY"
