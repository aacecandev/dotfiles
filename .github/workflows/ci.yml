# CI: on every push to main (a merged pull request), tag the commit with the
# next semantic version derived from Conventional Commits since the previous
# tag. The gates (pre-commit and the bootstrap test) run locally as pre-commit
# hooks before every commit; see .pre-commit-config.yaml and AGENTS.md.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag
      cancel-in-progress: false
    steps:
      # Full history and tags to find the last version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Bump rules (https://www.conventionalcommits.org):
      #   "type!:" or "BREAKING CHANGE:" -> major
      #   feat                           -> minor
      #   fix, perf                      -> patch
      #   anything else                  -> no new tag
      - name: Create semver tag
        run: |
          set -eu
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; last="v0.0.0"; fi
          log="$(git log --format='%s%n%b' "$range")"

          if printf '%s\n' "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
            bump=major
          elif printf '%s\n' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$log" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          else
            echo "No releasable commits since $last; skipping tag."
            exit 0
          fi

          IFS=. read -r major minor patch <<EOF
          ${last#v}
          EOF
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v$major.$minor.$patch"

          echo "$last -> $next ($bump)"
          git tag "$next" "$GITHUB_SHA"
          git push origin "refs/tags/$next"
          echo "Tagged $next" >> "$GITHUB_STEP_SUMMARY"
