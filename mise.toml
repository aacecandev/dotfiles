[dotfiles]
# ~/.zshenv is read first by every zsh, so it holds the exported environment,
# including ~/.local/bin (where mise.run installs mise) on PATH, so the startup
# files can call `mise` by name.
"~/.zshenv" = { source = ".config/zsh/.zshenv", mode = "symlink" }

# ~/.zshenv sets ZDOTDIR=~/.config/zsh, so zsh reads its other startup files
# from there; every zsh file below is deployed into that directory.
# .zshrc is a symlink covered by [dotfiles], so mise does NOT inject its
# activation block; the file carries `eval "$(mise activate zsh)"` itself.
# See https://mise.jdx.dev/dotfiles.html
"~/.config/zsh/.zshrc" = { source = ".config/zsh/.zshrc", mode = "symlink" }
"~/.config/zsh/completion.zsh" = { source = ".config/zsh/completion.zsh", mode = "symlink" }
"~/.config/zsh/functions.zsh" = { source = ".config/zsh/functions.zsh", mode = "symlink" }
"~/.config/zsh/functions_fzf.zsh" = { source = ".config/zsh/functions_fzf.zsh", mode = "symlink" }
"~/.config/zsh/keybindings.zsh" = { source = ".config/zsh/keybindings.zsh", mode = "symlink" }
# zsh completions directory: symlink it so completion.zsh can add it to FPATH.
"~/.config/zsh/completions" = { source = ".config/zsh/completions", mode = "symlink" }
# Login shells read $ZDOTDIR/.zprofile, not ~/.zprofile; it carries mise's
# shims line itself (bootstrap.mise_shell_activate ignores ZDOTDIR, so it is off).
# See https://mise.jdx.dev/bootstrap/shell.html
"~/.config/zsh/.zprofile" = { source = ".config/zsh/.zprofile", mode = "symlink" }

# Global mise tools config: symlink it so `mise install` picks up nvim et al.
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml", mode = "symlink" }

# Zsh plugin list for sheldon: symlink into the repo so edits track in git.
"~/.config/sheldon/plugins.toml" = { source = ".config/sheldon/plugins.toml", mode = "symlink" }

# Starship prompt config: symlink into the repo so edits track in git.
"~/.config/starship/starship.toml" = { source = ".config/starship/starship.toml", mode = "symlink" }

# vim config: symlink to ~/.vimrc (vim's default) so edits track in git.
"~/.vimrc" = { source = ".config/vim/.vimrc", mode = "symlink" }

# Neovim config: symlink the whole directory into the repo.
"~/.config/nvim" = { source = ".config/nvim", mode = "symlink" }

# Git config: rendered from a Tera template so machine-private values (the
# git_* [vars] below) never land in the repo. The target is a regular file
# that every apply overwrites: edit the .tera source, not the target.
# See https://mise.jdx.dev/dotfiles/managed.html
"~/.config/git/config" = { source = ".config/git/config.tera", mode = "template" }
# Global gitignore at git's default path ($XDG_CONFIG_HOME/git/ignore), so
# core.excludesFile stays unset. Symlink the file, not ~/.config/git, so the
# rendered config above stays out of the repo.
"~/.config/git/ignore" = { source = ".config/git/ignore", mode = "symlink" }
# Keep ~/.gitconfig as a real, untracked file. Git reads it after
# ~/.config/git/config, and `git config --global` (or `gh auth setup-git`)
# writes there instead of into the rendered file, so those writes survive.
# Line-entry keys are "<file>/<id>": ~/.gitconfig is the file mise edits and
# local-notice names the managed line. It is not a path inside a directory.
"~/.gitconfig/local-notice" = { line = '# Machine-local git config (untracked). Shared settings: ~/.config/git/config' }

# Public defaults for the private values rendered into ~/.config/git/config.
# Keep them empty here and set real values in the untracked mise.local.toml,
# whose [vars] take precedence. An empty value renders nothing.
# See https://mise.jdx.dev/configuration/vars.html
[vars]
git_name = ""           # user.name
git_email = ""          # user.email
git_signingkey = ""     # user.signingkey: SSH public key path or "key::ssh-..." literal; also turns on commit.gpgsign
git_credential_url = "" # host URL whose credentials use `helper = store`

# System packages installed via apt during `mise bootstrap`. This is the single
# source of truth for OS dependencies — the Dockerfile only installs the bare
# minimum needed to download mise itself (see install.sh).
# See https://mise.jdx.dev/bootstrap/packages/apt.html
[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:fontconfig" = "latest" # provides fc-cache for the Nerd Fonts hook
"apt:git" = "latest"
"apt:build-essential" = "latest"
"apt:zsh" = "latest"
"apt:unzip" = "latest"
"apt:trash-cli" = "latest"

# Off: these fixed paths (~/.zprofile, ~/.zshrc) ignore ZDOTDIR. The shims
# block is a [dotfiles] edit on $ZDOTDIR/.zprofile and .zshrc carries the
# full activation itself.
# See https://mise.jdx.dev/bootstrap/shell.html
[bootstrap.mise_shell_activate]
zsh = false

# Set the account's login shell to zsh.
# See https://mise.jdx.dev/bootstrap/shell.html#set-your-login-shell
[bootstrap.user]
login_shell = "/usr/bin/zsh"

# Before dotfiles are symlinked, back up any pre-existing (non-managed) Neovim
# config and data so the ~/.config/nvim symlink can be created without conflict.
# Guarded on "not already a symlink" so it runs once on migration and is skipped
# on later bootstraps (otherwise nvim's plugin data would be wiped every run).
# See https://mise.jdx.dev/bootstrap.html#run-order
[bootstrap.hooks.pre-dotfiles]
run = 'if [ -e "${HOME}/.config/nvim" ] && [ ! -L "${HOME}/.config/nvim" ]; then mv -f "${HOME}/.config/nvim" "${HOME}/.config/nvim.bak" >/dev/null 2>&1 || true; mv -f "${HOME}/.local/share/nvim" "${HOME}/.local/share/nvim.bak" >/dev/null 2>&1 || true; mv -f "${HOME}/.local/state/nvim" "${HOME}/.local/state/nvim.bak" >/dev/null 2>&1 || true; mv -f "${HOME}/.cache/nvim" "${HOME}/.cache/nvim.bak" >/dev/null 2>&1 || true; fi'

# After dotfiles are deployed, tell users without a git identity where to set
# it. Read-only and non-blocking: it only prints, so bootstrap still succeeds
# in non-interactive runs (Docker, CI). Reads config without a scope, because
# `git config --global` ignores the rendered ~/.config/git/config.
# See https://mise.jdx.dev/bootstrap.html#hooks
[bootstrap.hooks.post-dotfiles]
run = 'if command -v git >/dev/null 2>&1 && { [ -z "$(git -C "${HOME}" config --get user.name)" ] || [ -z "$(git -C "${HOME}" config --get user.email)" ]; }; then echo "NOTE: git user.name/user.email are not set, so git refuses to commit. Set git_name and git_email in mise.local.toml (see docs/private-settings.md)."; fi'

# After tools install, bootstrap vim-plug and install Nerd Fonts.
# See https://mise.jdx.dev/bootstrap.html#hooks
[bootstrap.hooks.post-tools]
run = [
  # vim-plug (pinned) so vim can manage plugins.
  'mkdir -p "${HOME}/.vim/autoload/plugged"',
  'curl -fLo "${HOME}/.vim/autoload/plug.vim" --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/0.14.0/plug.vim',
  # Install the plugins declared in ~/.vimrc (headless, non-interactive).
  'mise exec -- vim -E -s -u "${HOME}/.vimrc" +PlugInstall +qall || true',
  # Nerd Fonts (pinned) into ~/.local/share/fonts, then refresh the font cache.
  'mkdir -p "${HOME}/.local/share/fonts"',
  'for f in Hack JetBrainsMono FiraCode; do if ls "${HOME}/.local/share/fonts/${f}"*.ttf >/dev/null 2>&1; then echo "Nerd Font ${f} already installed, skipping"; else curl -fsSL "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/${f}.zip" -o "/tmp/${f}.zip" && unzip -oq "/tmp/${f}.zip" -d "${HOME}/.local/share/fonts" && rm -f "/tmp/${f}.zip"; fi; done',
  'fc-cache -f',
]

# Run the end-to-end test suite in a disposable Docker container via `mise test`.
# Delegates to tests/run.sh (the single entry point); never runs on the host.
# See https://mise.jdx.dev/tasks/
[tasks.test]
description = "Build, bootstrap, and test the dotfiles in a disposable container"
run = "sh tests/run.sh"

# Interactive aarch64 shell (Termux) under QEMU emulation, with this checkout
# mounted read-only at ~/dotfiles. Images are pinned by digest (tag in comment).
# https://github.com/dbhi/qus  https://github.com/termux/termux-docker
[tasks."test:arm64"]
description = "Open an emulated aarch64 Termux shell with the dotfiles mounted"
raw = true # attach the TTY so the container shell is interactive
run = [
  # Register QEMU binfmt handlers for aarch64/arm (skipped if already registered). aptman/qus:latest
  "[ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ] || docker run --rm --privileged aptman/qus@sha256:144a554404cd43721301d5163c278fc3b00d910476197f66357faaa1cd85f4c0 -s -- -p aarch64 arm",
  # termux/termux-docker:aarch64
  "docker run -it --rm --privileged --platform linux/arm64 -v \"$PWD:/data/data/com.termux/files/home/dotfiles:ro\" termux/termux-docker@sha256:d0415618cbbf8433a23cf5bddb198eeb62bcba1243ccfc1d015b2f464bd609d5",
]
